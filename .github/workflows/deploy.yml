# Construit le site et le déploie sur o2switch à chaque push sur main.
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions :
#   FTP_SERVER   (ex. ftp.somerloop.fr ou le nom du serveur o2switch)
#   FTP_USERNAME (compte FTP dédié, limité au dossier du site)
#   FTP_PASSWORD
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Envoi FTPS vers o2switch
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
